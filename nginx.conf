# =============================================================================
# nginx.conf — reverse proxy publik (port 80).
#   /       -> web:3000  (Next.js standalone)
#   /api/   -> api:4000  (Fastify, prefix /api/v1/... dipertahankan)
#
# SSE-aware: /api/v1/market/xauusd/stream mengalirkan tick Deriv via
# Server-Sent Events, jadi buffering/cache dimatikan dan timeout baca
# diperpanjang (1 jam). Connection "" wajib untuk keep-alive HTTP/1.1.
#
# resolver Docker (127.0.0.11) + proxy_pass variabel supaya nginx me-resolve
# ulang DNS saat container api/web restart (IP bisa berubah).
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # DNS internal Docker; TTL pendek supaya IP container yang restart
    # ter-resolve ulang tanpa reload nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Upgrade header untuk WebSocket (dev HMR / koneksi upgrade lain).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 10m;

        # ---------- API Fastify + SSE ----------
        location /api/ {
            set $api_upstream http://api:4000;
            proxy_pass $api_upstream$request_uri;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE: jangan buffer/cache respons stream; biarkan koneksi
            # terbuka lama (tick harga live).
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            gzip off;
        }

        # ---------- Web Next.js ----------
        location / {
            set $web_upstream http://web:3000;
            proxy_pass $web_upstream$request_uri;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
        }
    }
}
